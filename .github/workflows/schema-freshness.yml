name: Scaleway schema freshness

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scaleway-schema-freshness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - name: Check public schemas against reviewed provenance
        run: bun run fetch:schemas --output .forge/reports/schema-freshness
      - name: Publish review summary
        if: always()
        run: |
          if [ -f .forge/reports/schema-freshness/report.md ]; then
            cat .forge/reports/schema-freshness/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scaleway-schema-freshness
          path: .forge/reports/schema-freshness/
          retention-days: 30
          if-no-files-found: error
