name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.6"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun x tsc --noEmit
      - name: Run tests with coverage
        run: bun run test -- --coverage.enabled

  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Verify shebang
        run: |
          SHEBANG=$(head -1 dist/index.js)
          if [ "$SHEBANG" != "#!/usr/bin/env node" ]; then
            echo "ERROR: dist/index.js missing shebang (got: '$SHEBANG')"
            exit 1
          fi

      - name: Check package size
        run: |
          SIZE=$(npm pack --dry-run 2>&1 | grep "package size" | awk '{print $NF}')
          echo "Package size: $SIZE"
          BYTES=$(stat -c%s dist/index.js)
          if [ "$BYTES" -gt 5242880 ]; then
            echo "ERROR: dist/index.js exceeds 5MB ($BYTES bytes)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile

      - name: Extract version and dist-tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if echo "$VERSION" | grep -qE '\-alpha\.'; then
            echo "dist_tag=alpha" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif echo "$VERSION" | grep -qE '\-beta\.'; then
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif echo "$VERSION" | grep -qE '\-rc\.'; then
            echo "dist_tag=rc" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing (OIDC): npm >= 11.5.1 detects the GitHub OIDC token and
      # authenticates without NPM_TOKEN; the package is linked to this workflow on
      # npmjs.com (org feedback-loop-ai, repo mcp-scaleway, workflow release.yml).
      # NPM_TOKEN stays as a fallback until an OIDC publish is confirmed.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node --version

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ATTEMPT=1
          MAX_ATTEMPTS=2
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Publish attempt $ATTEMPT of $MAX_ATTEMPTS"
            if npm publish --provenance --access public --tag ${{ steps.version.outputs.dist_tag }}; then
              echo "Published successfully"
              exit 0
            fi
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Publish failed, retrying in 10 seconds..."
              sleep 10
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          echo "ERROR: npm publish failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, skipping"
            exit 0
          fi
          FLAGS="--generate-notes --notes-file CHANGELOG.md"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            FLAGS="$FLAGS --prerelease"
          fi
          gh release create "${{ steps.version.outputs.tag }}" $FLAGS
